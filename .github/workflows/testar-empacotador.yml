name: "Teste do empacotador (sem carros reais)"

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/testar-empacotador.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar montagem, manifests e duplicidade com dados ficticios
        run: python tests/test_build_pack.py
